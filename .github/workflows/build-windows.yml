name: Build Windows

# Fork-specific: validate the Windows (MinGW) build on every push to master.
# Upstream's "Test Prototypes" job builds Windows only on PRs, so a straight
# push/merge to master was previously unchecked. Push-only here so it doesn't
# duplicate that PR build; mirrors build-prototype.yml's toolchain.
on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'deps/**'
      - 'Makefile'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'build/cmake/**'
      - 'version.mk'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

# Don't stack builds for the same ref; cancel a superseded run.
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: "Build Windows x86 (MinGW)"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dkfans/setup-cpp@master

      - name: Update system
        run: |
          set -eux
          sudo apt update
          sudo apt install -y build-essential g++-mingw-w64-i686 cmake ninja-build libpng16-16t64 7zip

      - name: Build
        run: |
          set -eux
          VER_MAJOR=$(grep -E '^VER_MAJOR=' version.mk | cut -d= -f2)
          VER_MINOR=$(grep -E '^VER_MINOR=' version.mk | cut -d= -f2)
          VER_RELEASE=$(grep -E '^VER_RELEASE=' version.mk | cut -d= -f2)
          BUILD_NUMBER=$(git rev-list --count HEAD)
          PACKAGE_SUFFIX=CI_$(git rev-parse --short=7 HEAD)
          ARTIFACT_NAME=keeperfx-windows_x86-${VER_MAJOR}_${VER_MINOR}_${VER_RELEASE}_${BUILD_NUMBER}_${PACKAGE_SUFFIX}
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"
          # Compile with CMake (MinGW-w64 i686 cross-compile), as upstream's own
          # Windows job does since the CMake migration (#5083). This is a compile
          # check, so it builds the binaries only — no data assembly or CPack.
          cmake -S . -B out -G Ninja -DCMAKE_TOOLCHAIN_FILE=build/cmake/toolchains/mingw32.cmake \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_NUMBER="$BUILD_NUMBER" -DPACKAGE_SUFFIX="$PACKAGE_SUFFIX"
          cmake --build out --target keeperfx -j"$(nproc)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: out/keeperfx.exe
